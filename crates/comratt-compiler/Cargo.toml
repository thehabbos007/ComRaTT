[package]
name = "comratt-compiler"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
comratt-vm = { path = "../comratt-vm" }
wasm-encoder = { version = "0.225.0", features = ["wasmparser"] }
ena = "0.14.3"
pest = { version = "2.6", features = ["miette-error"] }
pest_derive = "2.6"
itertools = "0.14.0"
miette = "7.5"
wat = "1.225.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[features]
default = []
js = []
