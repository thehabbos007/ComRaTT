[package]
name = "comratt"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "comratt"
path = "src/bin.rs"

[dependencies]
comratt-vm = { path = "crates/comratt-vm" }
comratt-backend = { path = "crates/comratt-backend" }
itertools = "0.14.0"
wasm-encoder = { version = "0.225.0", features = ["wasmparser"] }
wat = "1.225.0"
ena = "0.14.3"
pest = { version = "2.6", features = ["miette-error"] }
miette = "7.5"
pest_derive = "2.6"
